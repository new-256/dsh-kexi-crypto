# dsh-kexi-crypto — bundle 补丁层（K析研判团 v1.0.0）
#
# 本文件由 DSH 插件系统在安装后自动作为 profile 的 bundle 层挂载：
#   dsh plugin --profile web add <本包路径或包名>
# 声明位置: 主包 package.json 的 dsh.bundle.patch。
#
# host 半用裸包名 dsh-kexi-crypto 解析（主包 package.json main →
# home-plugin/dsh-kexi-crypto/lib/index.mjs）；client 半（浏览器）靠主包
# package.json 的 dsh.client 声明被宿主 client-modules 自动纳入花名册，
# 无需单独一行 —— 也绝不能再加第二行 file:// 同插件行（双 ESM 实例 →
# 同名 provide 崩溃）。
#
# 此处只放通用默认值。机器特定配置（如自定义 Python 路径）请写在用户层补丁
#   Windows: %APPDATA%\DSH Desktop\dsh-home\cordis.patch.yml
# 的同 id 行里 —— 用户层后应用，按行 id 整体覆盖本行 config。
# 例如覆盖预设声明行以换 persona 文案：复制下方 preset-kexi-crypto 行、
# 改 config，写入用户层同名文件即可（同 id 整体替换）。
- insert:
    - id: kexi-dashboard
      name: dsh-kexi-crypto

# ═════════════════════════════════════════════════════════════════════════════
# preset-kexi-crypto 预设声明
#
# 按 DSH 0.1.6+ 预设机制（bundle patch 声明行）注册；legacy
# $DSH_HOME/.agent-presets/<id>/ 目录已无人读取。
#   - id: kexi-crypto（会话头 agentPreset 引用此 id）
#   - order 5：排在官方 standard 预设之后
#   - plugins 内本地插件行一律裸子路径名（preset-mount 的 baseUrl 不指向包内
#     目录，相对 './file' 形态不可移植；裸名走 Node 解析 + exports 子路径）
#
# 与 standard 花名册的差异（K析定制，全部有意识）：
#   - 无 workflow-*/ralph/mcp 行：研判团用 subagent 角色团编排，JS 工作流引擎
#     与 ralph 循环是纯 token 负担；
#   - 无 fork provider：spawn 子代不继承父对话（省上下文），角色成员本就按需
#     拿自包含任务书；
#   - v1.9.21 适配 DSH 0.2.1：dsh-tool-subagent 0.2.1-alpha.5 起移除
#     persona/toolFilter/backgroundMode 三个配置字段，apply 见到 persona 或
#     toolFilter 直接 throw，一行失败拖垮整组预设挂载（本预设在 0.2.1 上
#     "加载失败"的已证实根因，headless 引导注册表诊断原文：
#     "tool-subagent: persona is no longer supported; configure persona and
#     tool plugins in an Agent Preset and select it with agentPreset
#     (spawn only)"）。五个角色的人格与工具面拆成本文件先注册的五个
#     【成员预设】kexi-member-*（见下方第二个 insert；必须排在主预设之前：
#     主预设委派行 apply 时经 presets.readDocument 校验引用存在），
#     delegation 组每个角色行只留 provider/toolName/maxDepth/agentPreset；
#     旧 toolFilter.deny 语义改由成员预设工具行表达（不装
#     present/ask-user/goal/任何 subagent 行，tool-fs 配
#     write:false/edit:false），比黑名单更严（成员根本看不到这些工具）；
#     maxDepth 1 保留（D9 修复：maxDepth 是"绝对深度上限"而非"子代可再派
#     层数"——主理人 depth 0 派成员 childDepth=1，配 0 连第一次委派都被拒，
#     实测报 "subagent depth 1 exceeds maxDepth 0"），与成员预设无委派工具
#     形成双保险；
#   - tool-present：主理人以文件卡片交付看板；
#   - 预设自带技能库（crypto-market-analysis / kexi-team-orchestration /
#     token-budget-discipline）经 skill-filesystem customSkillDirs 挂载。
#
# 服务行纪律（照 agy-first 实战注释）：own 的行只注册进宿主注册表
# （tools/systemPrompt/skills/...）、不 provide 服务 → 无需 isolate realm；
# 需要 realm 的只有 planning（planMode）与 compaction（compaction+
# toolResultPruner），照抄 agy 的组结构即可。
- insert:
    # 五个成员预设（人格 + 只读工具面 + kexi 脚本链）必须在主预设之前注册：
    # 0.2.1 起 dsh-tool-subagent 不再接受 persona/toolFilter，角色人格只能以
    # 独立 Agent Preset 存在并由委派行经 agentPreset 选择。include 文件是裸
    # entry list（无 - insert: 外层）。
    # ⚠ path 必须用 !!js 解析成【包内绝对路径】：cordis-plugin-include 按
    #   new URL(config.path, ctx.baseUrl) 解析，而 bundle 行的 ctx.baseUrl 是
    #   profile 根（dsh-home/profiles/web/），不是补丁所在目录——写相对路径
    #   './kexi-member-presets.yml' 会被解析成 profile 根下的同名文件，报
    #   "config file not found" 且五个成员预设静默丢失（headless 实测）。
    #   与 skill-filesystem customSkillDirs 同款包名锚定，兼容两种 baseUrl；
    #   不做 try/catch 兜底——解析失败应原样抛出（fail-loud），不得静默丢预设。
    # ── 五个成员预设（v1.9.21 适配 DSH 0.2.1）────────────────────────────
    # 0.2.1 的 dsh-tool-subagent 移除 persona/toolFilter/backgroundMode 配置
    # 字段，角色人格必须以独立 Agent Preset 存在并由委派行 agentPreset 引用
    # （apply 时 readDocument 校验引用存在，故这些行必须在 preset-kexi-crypto
    # 之前声明）。
    # ⚠ 曾尝试 cordis:include 外部文件：其 path 按 new URL(path, ctx.baseUrl)
    #   解析且不支持 !!js，bundle 行 baseUrl=profile 根 → 相对路径必炸
    #   "config file not found" / 'extension "" not supported'（均 headless
    #   实测）。故改为内联声明；persona 正文放包内 member-personas/*.md，
    #   经值位置 !!js（包名锚定，同 customSkillDirs 模式）读入，跨机器可移植，
    #   文件缺失时 fail-loud。

    - id: preset-kexi-member-market-data
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: kexi-member-market-data
        # v1.9.23：description 会被塞进委派工具的 agent_preset 参数说明
        # （dsh-tool-subagent L234：`${id}: ${description}`），必须单行 ≤30 字；
        # order 900+ 排在全部用户可选用预设之后；name 标「内部」便于日志辨认。
        name: '数脉·行情取数（内部）'
        description: 行情取数与数据质检，团队唯一数据入口
        order: 901
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: !!js >-
                process.getBuiltinModule('node:fs').readFileSync(
                  process.getBuiltinModule('node:path').join(
                    process.getBuiltinModule('node:path').dirname(
                      process.getBuiltinModule('node:module').createRequire(
                        process.getBuiltinModule('node:url').fileURLToPath(baseUrl) + 'index.js'
                      ).resolve('dsh-kexi-crypto/package.json')
                    ),
                    'home-plugin', 'dsh-kexi-crypto', 'member-personas', 'market-data.md'
                  ),
                  'utf8'
                ).trim()
              includeRuntimeContext: true

          # 平台门控 shell（与主预设同款二选一）；成员纪律要求分析脚本一律
          # 走 kexi_run，shell 仅限产物查看与环境排查。
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # 只读文件面（旧 toolFilter.deny:[write,edit] 在 0.2.1 的新表达：
          # 写/改工具直接不存在，比黑名单更严格；read_image 保留以便核对图表）。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # kexi 脚本链工具（成员唯一分析手段）；挂载同时注入 kexi:policy 纪律段。
          - id: kexi-plugin
            name: 'dsh-kexi-crypto/kexi-plugin'

    - id: preset-kexi-member-technical
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: kexi-member-technical
