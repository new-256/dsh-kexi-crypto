    - id: preset-kexi-crypto
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: kexi-crypto
        name: K析研判团
        description: >-
          加密货币趋势研判 6 人专家团：主理人「K析」统筹编排，数脉（行情取数与数据质检）、
          指北（技术指标与形态）、望潮（7日三情景概率推演）、守拙（风险定级与提示）、
          证伪（攻击结论前提的唱反调官）五位成员为独立 subagent 角色。零第三方依赖 Python
          脚本链（取数→指标→组装→契约校验→token 压缩→自包含 HTML 看板），内置停更数据拦截、
          ADV20 流动性门槛、相关性伪分散检测、ATR 仓位预算、结论置信度分级、跨所跨源矛盾检测
          与决策留痕对账；报告先过 JSON 契约闸门再以文件卡片交付，全流程省 token。
        order: 5
        plugins:
          # ── identity ─────────────────────────────────────────────────────────
          # 主理人人格（preset 作用域 dsh-persona，遮蔽部署默认人格）。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是「K析」，加密趋势研判团**主理人（团队负责人）**。模型 {{model}}。
                这是一个**六人智能体团队**：你只负责**编排、把关与交付**，具体分析由五位成员完成：
                数脉 = 行情取数与多面数据质检，唯一数据入口；
                指北 = 指标计算、形态量价、位置与多周期研判；
                望潮 = 7 日三情景概率推演与可证伪区间、止盈止损与底仓策略；
                守拙 = 风险定级、实盘风控闸门、保活监控与战绩复盘；
                证伪 = **唱反调官**，专门攻击结论的前提（不是再做一遍风控）。
                【会话第一步，只做一次】先调用 kexi_ensure_team —— 它幂等创建五位**持久成员**，
                直接显示在会话页「智能体团队」面板；成员初始就绪后保持待命。
                【默认工作方式 = 先快答、再深研（v1.5.3，最高优先级）】：
                实测单币走完整团队协作要 **17 分钟**，而同一套分析脚本串起来只要 **~1 秒**
                （fetch 505ms + 指标/位置/多周期/入场时机/币种画像 ≈ 400ms）——
                99.9% 的时间耗在模型编排往返，**结果出来时币价已经涨了几个点**。因此：
                ① 任何"XX 币怎么样/能不能买/什么价进"的问题，**第一步先 kexi_run(mode=fast,
                symbol=XXX)**（多币用 symbols=A,B,C）拿秒级结论——含评级、**结论置信度（高/中/低，
                低置信时工具会自动收回「立即入场」）**、90日位置、多周期方向、入场动作与价位、
                失效位、追高嫌疑、币种画像、三情景，**先把可执行价位交给用户**；
                ② 只有用户明确要"深度论证 / 成员交叉验证 / 多币对比 / 完整看板"时，才升级为团队协作：
                **必须按顺序用 send_message 给持久成员派活**（数脉取数→指北指标→望潮情景→守拙风控
                →**证伪唱反调**；给成员的消息 ≤3 行：任务 + 输入文件路径 + 输出要求，不要重复角色设定），
                你不代写成员的结论、不亲自跑成员的脚本；让用户在团队面板与实时进度弹窗里
                能看到每一位成员在干活。
                ③ 升级深研时把 fast_analysis.json 直接喂给成员，**不要重算**（同一脚本口径）。
                ④ 对话里必须如实标注结论来源是"快答（确定性脚本，~1s）"还是"团队深研（成员交叉验证）"。
                仅当①用户只是问一句极简快答（如"BTC现价多少"）或②持久团队/委派通道确实不可用时，
                才改用按需委派工具或自己用 kexi_run 直接处理，并在②时如实说明"本次由主理人直接驱动"。
                铁律：① 一切价格与指标数字必须来自成员的落盘返回值或 kexi_* 工具，禁止凭记忆报价或编造；
                ② 成员结论为权威，不代写、不改数字，信号矛盾时下调置信度并呈现分歧；
                ③ **红队强制（v1.5.9）**：守拙管风险闸门、望潮管情景推演，但**没有人专门攻击结论的前提**
                   ——这是编排的真实空缺。故深研时证伪必须最后派、且必须真派，把望潮三情景与守拙评级
                   原文发给他，要求输出①最脆弱前提（标可观测/不可观测）②backtest.py 历史基础率（含样本数）
                   ③反事实压力测试 ④"看到什么就撤回看多"的触发条件。**不得把证伪当"又一个风控意见"处理，
                   也不得因为"预计没问题"就不派**——他回答"未发现致命漏洞但基础率仅 N 例"同样是有效产出。
                   汇报时必须**如实转述证伪的反对意见**；若与望潮冲突，**两条都呈现并下调整体置信度**，
                   不得只留顺耳的那条；
                ④ 选币必须结合位置与多周期（90日位置、距高点回撤、放量天数拥挤度扣分；周月线逆向判弱反弹；
                   风控结论反向约束名单，宁缺毋滥不硬凑）；
                ⑤ 三情景推演必带具体价格区间（事前可证伪），吸收战绩实操经验（三法交叉止盈止损、底仓分批）；
                ⑥ 数据源诚实说明：外部新闻不可用显式标记「新闻面缺失」快速跳过；2026 年 X 社媒受限以 F&G 情绪替代向用户明示；
                ⑦ CEX 账户纪律（v1.6.0）：实盘能力真实存在，但**自主级别（只读/提议+确认/受限自动/全自动）
                   由用户在设置面板决定，AI 无权修改**——被拦下时如实转述拦截原因，**严禁重试、严禁换参数绕过**；
                   读余额/持仓一律用 kexi_cex（action=balances/positions/all_positions），**不要手写 cex_adapter.py 的 argv**；
                   下单前必须先 action=journal 查未决单（37% 回合失败率下防重复下单）再 action=all_positions 读全部持仓；
                   每次下单必填 reason 与 idem_seq；受限自动档必须给 stop_loss；
                   CEX 结论必须区分「链上公开数据」与「用户的真实账户数据」，不得混为一谈；
                ⑧ 最终报告必附免责声明；
                ⑨ 交付 = 五段式文本（结论/关键位/三情景/风险/免责）+ 用 present 交付 kexi_dashboard 或 track_report 生成的 HTML 看板。
                省 token：大 JSON 一律落盘 kexi_out/，上下文只留摘要与路径；
                团队编排的标准流程见 kexi-team-orchestration 技能（工作流 A-M）。用中文回复。
              includeRuntimeContext: true

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ────────────────────────────────────────────────────────────
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ───────────────────────────────────────────────────────
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ─────────────────────────────────────────────────
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ───────────────────────────────────────────────────────────
          # customSkillDirs 追加本包技能根 <pkg>/preset/kexi-crypto/skills。
          # ⚠ baseUrl 语义（v1.1.0 实测）：host 补丁行里 baseUrl 是补丁所在目录 URL，
          # 但 **preset 行内**的 baseUrl 是 profile 根（如 dsh-home/profiles/web/），
          # 与包内目录无关 —— 故不可用 '../../preset/...' 相对推导（见下方血泪教训）。
          # 目录缺失时技能为空、不影响挂载。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              # customSkillDirs 是【值位置】的 !!js，表达式必须返回 string[]（整块替换该字段）。
              # ⚠ 血泪教训（v1.0.0 真实故障）：
              #   1) 不可写成 `customSkillDirs:` + `- !!js` 列表项——那样表达式返回值会被再套一层，
              #      变成 [["<path>"]]，schemastery 报 `$.customSkillDirs[0] expected string but got <path>`
              #      （数组 String() 恰好等于其唯一元素，故报错文本看起来像"路径类型错了"）。
              #   2) 不可用 baseUrl 相对推导包内目录——preset 挂载时 baseUrl 是【profile 根】
              #      （如 dsh-home/profiles/web/），不是包内补丁目录，'../../preset/...' 会算到
              #      dsh-home/preset/... 这个不存在的路径（同 agy-first-bridge 补丁第 38-39 行结论）。
              # 正确锚点：用 createRequire 锚在 baseUrl 上按【包名】解析 package.json，
              # 兼容 baseUrl 为 profile 根 或 包内目录 两种组合场景（Node 自 node_modules 上溯查找）。
              # 解析失败返回 []（空数组=不新增技能根），绝不留空字符串（空串会被 resolve 成 cwd）。
              customSkillDirs: !!js >-
                (() => {
                  try {
                    const M = process.getBuiltinModule('node:module');
                    const p = process.getBuiltinModule('node:path');
                    const u = process.getBuiltinModule('node:url');
                    const anchor = u.fileURLToPath(baseUrl);
                    const req = M.createRequire(anchor.endsWith(p.sep) ? anchor + 'index.js' : anchor);
                    const pkg = req.resolve('dsh-kexi-crypto/package.json');
                    return [p.join(p.dirname(pkg), 'preset', 'kexi-crypto', 'skills')];
                  } catch {
                    return [];
                  }
                })()

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ────────────────────────────────────────────────────────────
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode（realm：planMode 是被 ctx.get 的服务）──────────────────
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction（realm：compaction-basic 经 ctx.get 读 toolResultPruner）
          # 研判流水线的工具结果（脚本 JSON/HTML 字节数）是主要上下文压力源，
          # pruner 阈值比 agy 更紧一档。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 6144
                  headChars: 3072
                  tailChars: 1024

          # ── delegation（角色团，v1.9.21 适配 0.2.1；v1.9.23 收敛为单工具；v1.9.24 删 list-agents 子路径行）─────
          # subagents 注册表与 spawn 后端在 HOST 组合（进程单例）；本组只贡献
          # 委派工具行。0.2.1 的 dsh-tool-subagent 移除了 persona/toolFilter/
          # backgroundMode 配置字段——角色人格与裁剪后的工具面已拆到本补丁
          # 上方声明的五个成员预设 kexi-member-*。
          #
          # v1.9.23：**6 行 → 1 行**。旧实现每角色一个工具
          # （market_data_specialist / technical_indicators / trend_forecaster /
          #  risk_assessor / falsification_challenger + 通用 subagent），
          # 模型每次派活要在 6 个语义重叠的工具里选，且"工具名即身份"的假设把
          # host/client/脚本里的映射全部钉死在工具名上。0.2.1 支持
          # `allowedAgentPresets`：单行即派生带枚举的 `agent_preset` 参数
          # （取证：dsh-tool-subagent/lib/index.js L311-322 的 Config、
          #  L400-404 的 schema 派生、L227-237 用预设 description 生成参数说明、
          #  L250-256 的取值校验），身份改由 preset id 派生（唯一真源
          #  lib/members.mjs）。
          #
          # v1.9.24：**删除** `tool-subagent-list-agents` 行。DSH 0.2.2 起
          # dsh-tool-subagent-control 主入口（src/index.ts）已统一注册全部四个
          # 工具（send_message / interrupt_agent / wait_agent / list_agents），
          # 且 `/list-agents` 子路径导出已从 exports 移除（仅剩 . / ./src/* /
          # ./package.json / ./locale/*.json）。该行导致 cordis loader 报
          # `tool-subagent-list-agents ... never started`，整个 kexi-crypto
          # 预设被判 BROKEN → GUI「加载失败」（→ 本轮真因）。list_agents
          # 功能已由上方 tool-subagent-control 行覆盖，无需再声明。
          #
          # maxDepth: 1 = 主理人 depth 0 可派出成员（childDepth=1）；成员预设内
          # 无任何委派工具，成员无法再派（双保险）。不传 agentPreset：模型省略
          # agent_preset 时子代理继承主理人当前预设（自查/复核路径仍在）。
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              # 唯一委派工具：成员身份由 preset id 经 agent_preset 参数指定。
              # ⚠ 这五个 id 必须与 lib/members.mjs 的 MEMBER_PRESET_IDS 及下方
              #   五个 preset-kexi-member-* 声明行 **完全一致**——verify.mjs 做双向
              #   集合断言，只改一处会直接红（防止将来加成员时漏改）。
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  maxDepth: 1
                  allowedAgentPresets:
                    - kexi-member-market-data
                    - kexi-member-technical
                    - kexi-member-forecaster
                    - kexi-member-risk
                    - kexi-member-falsifier


          # ── 交付与其余 model-facing 行 ──────────────────────────────────────
          # 看板的文件卡片交付通道（主理人专用）；限 4 份防刷屏。
          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'
            config:
              maxFiles: 4

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # web_search 供事件面研究（上币公告/宏观日历）；fetch 关闭以省上下文。
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000

          # ── kexi bridge（本包 preset 插件）──────────────────────────────────
          # 注册 kexi_run / kexi_validate / kexi_dashboard 三个模型工具（包装
          # skills/crypto-market-analysis/scripts 的 Python 脚本链，产物落盘
          # kexi_out/、只回紧凑摘要），注入"kexi:policy"执行纪律段，并向家级
          # kexi-dashboard 灯推送 kexi/mode 心跳与 kexi/status 快照。
          # 不 provide 服务 → 无需 realm（与 agy-first-bridge 同款挂载形态）。
          - id: kexi-plugin
            name: 'dsh-kexi-crypto/kexi-plugin'
